<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#FFFFFF">
    <meta name="description" content="NEXOS — Red de ayuda en tiempo real. Explora los barrios de Cali y apoya donde más se necesita.">
    <title>NEXOS · Red de ayuda</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <!-- Loading screen: in the page itself, so it shows before any script arrives (see boot.js) -->
    <div class="boot" role="status">
        <p class="boot-logo" aria-label="NEXOS">NE<span class="brand-x">X</span>OS</p>
        <div class="boot-bar" role="progressbar" aria-label="Cargando" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><span class="boot-fill"></span></div>
        <p class="boot-text">Preparando el mapa…</p>
        <p class="boot-slow" hidden><span>¿Va lento?</span><button class="boot-link" type="button">Abrir la versión ligera</button></p>
    </div>

    <!-- 3D world -->
    <canvas class="webgl" aria-hidden="true"></canvas>
    <div class="vignette" aria-hidden="true"></div>

    <!-- Interface -->
    <div id="ui" class="ui" data-state="boot" data-role="">

        <header class="topbar glass" aria-label="NEXOS">
            <div class="brand">
                <span class="brand-mark" aria-label="NEXOS">NE<span class="brand-x">X</span>OS</span>
            </div>
            <span class="topbar-divider" aria-hidden="true"></span>
            <div class="context">
                <span class="context-icon" data-icon="map" aria-hidden="true"></span>
                <span class="context-text">
                    <strong class="context-title">Mapa de ayuda</strong>
                    <span class="context-sub">Cali, Valle del Cauca</span>
                </span>
            </div>
            <div class="clock" role="timer" title="Hora y clima en Cali">
                <span class="clock-icon" data-icon="sun" aria-hidden="true"></span>
                <span class="clock-text">
                    <strong class="clock-time">--:--</strong>
                    <span class="clock-sub">Cali</span>
                </span>
            </div>
            <button class="icon-btn sound-btn js-sound" type="button" aria-pressed="true" aria-label="Silenciar sonido" title="Sonido">
                <span data-icon="sound" aria-hidden="true"></span>
            </button>
            <div class="session">
                <button class="exit-btn js-exit" type="button" aria-label="Salir" title="Salir">
                    <span data-icon="logout" aria-hidden="true"></span>
                </button>
            </div>
        </header>

        <!-- Where am I? -->
        <nav class="progress glass" aria-label="Progreso" hidden></nav>

        <button class="back-btn glass" type="button" hidden>
            <span data-icon="chevron-left" aria-hidden="true"></span>
            <span class="back-label">Volver al mapa</span>
        </button>

        <!-- Step 0 · choose a role (over the aerial clouds) -->
        <section class="role" aria-labelledby="role-title">
            <div class="role-card">
                <p class="theme-chip"><span data-icon="alert" aria-hidden="true"></span><span class="theme-chip-text"></span></p>
                <h1 id="role-title" class="intro-logo">NE<span class="brand-x">X</span>OS</h1>
                <p class="intro-tag">Red de ayuda en tiempo real</p>
                <p class="intro-lead"></p>
                <div class="role-options">
                    <button class="role-btn role-donor" type="button" data-role="donor">
                        <span class="role-icon" data-icon="heart" aria-hidden="true"></span>
                        <span class="role-text"><strong>Quiero donar</strong><span>Elige un barrio y arma una cesta de apoyo.</span></span>
                        <span class="role-go" data-icon="chevron-right" aria-hidden="true"></span>
                    </button>
                    <button class="role-btn role-point" type="button" data-role="collector">
                        <span class="role-icon" data-icon="box" aria-hidden="true"></span>
                        <span class="role-text"><strong>Soy punto de acopio</strong><span>Ingresa y actualiza el inventario de tu zona.</span></span>
                        <span class="role-go" data-icon="chevron-right" aria-hidden="true"></span>
                    </button>
                </div>
                <div class="role-links">
                    <button class="role-track js-track" type="button"><span data-icon="search" aria-hidden="true"></span>¿Ya donaste? Sigue tu aporte</button>
                    <button class="role-track js-lite" type="button"><span data-icon="phone" aria-hidden="true"></span>Versión ligera, sin 3D</button>
                </div>
            </div>
            <!-- the city from our own 3D map, behind a curved edge with a red accent and a thin line -->
            <div class="role-art" aria-hidden="true">
                <img class="role-art-img" src="/assets/ui/portada-ciudad.webp" alt="" width="1158" height="1320" decoding="async">
                <svg class="role-art-edge" viewBox="0 0 200 1000" preserveAspectRatio="none">
                    <path class="edge-red" d="M0 0H196C150 70 168 160 136 250C110 320 128 380 104 450C80 300 70 150 0 0Z"/>
                    <path class="edge-white" d="M0 0H118C52 150 150 300 92 500C44 660 140 800 62 1000H0Z"/>
                    <path class="edge-line" d="M150 0C84 160 182 320 122 520C70 690 168 830 92 1000"/>
                </svg>
            </div>
        </section>

        <!-- Collection point access -->
        <section class="login" aria-labelledby="login-title" hidden>
            <form class="login-card glass" novalidate>
                <div class="lg-head">
                    <span class="lg-mark"><span data-icon="box" aria-hidden="true"></span></span>
                    <div>
                        <h2 id="login-title">Acceso para puntos de acopio</h2>
                        <p class="sub">Usa el código de tu punto y tu clave.</p>
                    </div>
                </div>
                <div class="lg-fields js-login-fields"></div>
                <p class="form-error" role="alert" hidden></p>
                <div class="js-point-picker"></div>
                <div class="form-actions">
                    <button class="btn btn-secondary js-login-back" type="button"><span data-icon="chevron-left" aria-hidden="true"></span> Volver</button>
                    <button class="btn btn-primary js-login-submit" type="submit">Ingresar</button>
                </div>
            </form>
        </section>

        <!-- Soft caption during the descent, with a way to cut it short -->
        <p class="descent-caption glass" aria-live="polite">Llegando a Cali…</p>
        <button class="btn btn-secondary glass skip-intro" type="button" hidden>Entrar ahora</button>

        <!-- Floating labels anchored to the 3D world -->
        <div class="labels" aria-label="Lugares disponibles"></div>

        <!-- Phones: the zones as a list at the side, so the markers do not cover the city -->
        <nav class="zone-list" aria-label="Zonas de la ciudad"></nav>

        <!-- Guide (city view: docked portrait) -->
        <div class="guide-dock" hidden>
            <div class="guide-portrait" aria-hidden="true"></div>
            <div class="bubble bubble-dock glass" role="status" aria-live="polite"></div>
        </div>

        <!-- Map helper (limited orbit) -->
        <button class="recenter glass" type="button" hidden>
            <span data-icon="target" aria-hidden="true"></span>
            <span>Centrar mapa</span>
        </button>

        <!-- Live map: what is happening right now, anywhere -->
        <p class="live-note glass" role="status" aria-live="polite" hidden><span class="live-dot" aria-hidden="true"></span><b>En vivo</b><span class="live-text"></span></p>

        <!-- Zone card -->
        <aside class="zone-card glass" aria-labelledby="zone-title" hidden></aside>

        <!-- Supply panel (donor or collection point) -->
        <aside class="supply-panel glass" aria-labelledby="supply-title" hidden></aside>

        <!-- What just happened, with a way to undo it -->
        <div class="toast glass" role="status" aria-live="polite" hidden></div>

        <!-- Questions before something that cannot be undone, and help -->
        <!-- ¿Dónde está mi ayuda? (following a donation by its code) -->
        <section class="track" aria-labelledby="track-title" hidden>
            <div class="track-card" role="dialog" aria-modal="true" aria-labelledby="track-title"></div>
        </section>

        <div class="dialog-backdrop" hidden>
            <div class="dialog glass" role="alertdialog" aria-modal="true" aria-labelledby="dialog-title"></div>
        </div>

        <!-- Soft cloud veil used between city and neighborhood -->
        <div class="veil" aria-hidden="true">
            <span></span><span></span><span></span><span></span>
        </div>

        <!-- First paint -->
        <div class="loader" role="status" aria-live="polite">
            <div class="loader-logo">NE<span class="brand-x">X</span>OS</div>
        </div>
    </div>

    <!-- 3D items drawn on top of the glass panels (supplies, guide portrait) -->
    <canvas class="items" aria-hidden="true"></canvas>

    <script type="module" src="./script.js"></script>
</body>
</html>
