name: Deploy to GitHub Pages

# The published app is always main, at the site's root. The version being tried out
# (branch funciones-nuevas) is built beside it, at /prueba/, so it can be opened on a
# phone without touching the published one. Pages only deploys from main, so the trial
# version goes out with the next run on main (a push to main, or "Run workflow").
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build

      # the trial version, if the branch exists
      - uses: actions/checkout@v4
        continue-on-error: true
        with:
          ref: funciones-nuevas
          path: prueba-src
      - name: Build the trial version at /prueba/
        if: hashFiles('prueba-src/package.json') != ''
        working-directory: prueba-src
        run: |
          npm install
          npm run build
          mkdir -p ../dist/prueba
          cp -r dist/. ../dist/prueba/

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
