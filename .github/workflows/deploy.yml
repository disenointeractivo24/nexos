name: Deploy to GitHub Pages

# The published app is main, at the site's root: every push to main builds and publishes it.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      # The augmented reality experience is its own project (see ar/README.md), published at /ar/
      - run: npm install --prefix ar
      - run: npm test --prefix ar
      - run: npm run build --prefix ar
      - run: cp -r ar/dist dist/ar

      # The next version of the AR experience, from the ar1 branch, published beside it at /ar1/.
      # Pages only deploys from main: after pushing to ar1, run this workflow by hand on main.
      - uses: actions/checkout@v4
        with:
          ref: ar1
          path: ar1src
      - run: npm install --prefix ar1src
      - run: npm install --prefix ar1src/ar
      - run: npm test --prefix ar1src/ar
      - run: npm run build --prefix ar1src/ar
      - run: cp -r ar1src/ar/dist dist/ar1

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
